/* Gate */

 background:linear-gradient(180deg,color-mix(in srgb,var(--overlay,#000) 50%,transparent),transparent 140px),linear-gradient(180deg,color-mix(in srgb,var(--overlay,#000) 30%,transparent),color-mix(in srgb,var(--overlay,#000) 45%,transparent)),var(--hero,linear-gradient(135deg,var(--euc),color-mix(in srgb,var(--euc) 45%,var(--chalk)) 55%,var(--sand))) center/cover}

.gate{transition:opacity .45s ease}

.gate h1 em{font-style:italic;opacity:.8}

.err{color:#ffd9d0;flex-basis:100%;min-height:1.4em;font-size:15px}

.hint{font-size:14px;opacity:.7;margin:2px 0 8px}

/* centred guest pages (admin tabs stay left-aligned) */

nav div{justify-content:center;justify-content:safe center}

.banner{align-content:center;justify-items:center;text-align:center}

let CODE = "";

/* gifts ticked on this device are remembered (same list as the wedding site) */
function sessionStorageSafe(op, v){ try { return op==="get" ? localStorage.getItem("claimed") : localStorage.setItem("claimed", v); } catch(e){ return null; } }
const mine = new Set(JSON.parse(sessionStorageSafe("get") || "[]"));
const linkBtn = (label, fn) => { const b = document.createElement("button"); b.type = "button"; b.className = "lnk"; b.textContent = label; b.onclick = fn; return b; };

async function rpc(fn, args){
  const k = CONFIG.SUPABASE_ANON_KEY;
  const r = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method:"POST",
    headers:Object.assign({"Content-Type":"application/json", apikey:k}, k.startsWith("eyJ") ? {Authorization:"Bearer " + k} : {}),
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error("Request failed");
  return r.json();
}

/* ---- Look ---- */
const HEX = /^#[0-9a-fA-F]{6}$/;
const THEME = [["bg","--chalk"],["text","--ink"],["accent","--euc"],["band","--sand"],["button","--btn"]];
function textOn(hex){
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#1D2A24" : "#FFFFFF";
}
function applyTheme(c){
  c = c || {};
  const root = document.documentElement.style;
  THEME.forEach(([k,v]) => { if (HEX.test(c[k]||"")) root.setProperty(v, c[k]); else root.removeProperty(v); });
  if (HEX.test(c.button||"")) root.setProperty("--btn-text", textOn(c.button)); else root.removeProperty("--btn-text");
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = HEX.test(c.bg||"") ? c.bg : "#FBF7F4";
}
function richText(el, text){
  el.textContent = ""; text = text || "";
  const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g; let last = 0, m;
  while ((m = re.exec(text))){
    el.append(text.slice(last, m.index));
    const a = document.createElement("a"); a.href = m[2]; a.textContent = m[1]; a.target = "_blank"; a.rel = "noopener"; el.append(a);
    last = re.lastIndex;
  }
  el.append(text.slice(last));
}

/* ---- Content (from the engagement_settings table in Supabase) ---- */
const S = { title:"Engagement party", event_date:"", place:"", hero_photo:"", colors:{}, welcome:"", registry_intro:"", details:[], open:false };
async function fetchSettings(code){
  try {
    const r = await rpc("get_engagement", {p_code:code});
    if (r){
      Object.keys(r).forEach(k => { if (r[k] !== null && r[k] !== "") S[k] = r[k]; });
      S.hero_photo = r.hero_photo || ""; S.colors = r.colors || {};
      ["welcome","registry_intro"].forEach(k => { if (k in r) S[k] = r[k] || ""; });
      if ("details" in r) S.details = r.details || [];
    }
    return r;
  } catch(e){}
  return null;
}
const whenLine = () => [S.event_date, S.place].filter(Boolean).join(", ");
function applyGate(){
  applyTheme(S.colors);
  document.title = S.title;
  $("gateNames").textContent = S.title; $("gateWhen").textContent = whenLine();
  if (S.hero_photo) document.documentElement.style.setProperty("--hero", 'url("' + encodeURI(S.hero_photo) + '")');
  else document.documentElement.style.removeProperty("--hero");
  /* no code needed: swap the code box for a simple Enter button */
  const open = !!S.open;
  $("code").hidden = open; $("code").required = !open;
  $("codeForm").querySelector("label").hidden = open;
  $("codeBtn").textContent = open ? "Enter" : "Open";
}
function applySite(){
  $("navNames").textContent = S.title;
  $("welcome").textContent = S.welcome || "Come and celebrate with us.";
  $("bannerWhen").textContent = whenLine();
  $("regIntro").textContent = S.registry_intro || "";
  $("footer").textContent = S.title + (S.event_date ? " · " + S.event_date : "");
  $("detailsGrid").innerHTML = "";
  (S.details || []).forEach(d => {
    const el = document.createElement("div");
    el.innerHTML = "<h3></h3><p></p>";
    el.firstChild.textContent = d.title || ""; richText(el.lastChild, d.body);
    $("detailsGrid").append(el);
  });
}

/* ---- Tabs ---- */
const TABS = ["party","registry"];
function setNavH(){ const n = document.querySelector("nav"); if (n && !$("site").hidden) document.documentElement.style.setProperty("--navh", n.offsetHeight + "px"); }
function onScroll(){ document.body.classList.toggle("scrolled", scrollY > 24); }
addEventListener("scroll", onScroll, {passive:true}); addEventListener("resize", setNavH);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(setNavH);
function showTab(name, push){
  if (!TABS.includes(name)) name = "party";
  document.querySelectorAll("[data-tab]").forEach(el => el.classList.toggle("on", el.dataset.tab === name));
  document.body.dataset.page = name;
  const hasHero = !!document.querySelector('.banner[data-tab="' + name + '"]') || (name === "story" && $("story") && $("story").classList.contains("has-photo"));
  document.body.classList.toggle("hero", hasHero);
  setNavH(); onScroll();
  document.querySelectorAll("nav a[data-go]").forEach(a => {
    const on = a.dataset.go === name; a.classList.toggle("on", on);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (push){ try { history.replaceState(null, "", "#" + name); } catch(e){} }
  scrollTo(0, 0);
}
document.querySelectorAll("nav a[data-go]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); showTab(a.dataset.go, true); }));

/* ---- Code screen ---- */
$("codeForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("codeErr").textContent = ""; $("codeBtn").disabled = true;
  try {
    if (S.open){ CODE = "~open"; await unlock(); return; }
    const code = $("code").value.trim().toUpperCase();
    const g = await rpc("check_code", {p_code: code});
    if (!g){ $("codeErr").textContent = "That code didn’t work. Check your invitation and try again."; return; }
    CODE = code; await unlock();
  } catch(err){ $("codeErr").textContent = "Something went wrong. Please try again in a moment."; }
  finally { $("codeBtn").disabled = false; }
});
async function unlock(){
  const r = await fetchSettings(CODE);
  if (CODE === "~open" && !(r && "details" in r)){   /* the page has since been closed to the public */
    S.open = false; CODE = ""; applyGate(); $("codeErr").textContent = "Please enter the code from your invitation."; return;
  }
  applyGate(); applySite();
  $("gate").hidden = true; $("site").hidden = false; document.body.classList.add("in");
  showTab(location.hash.slice(1), false);
  loadRegistry();
}

/* ---- Registry (same gifts and behaviour as the wedding site) ---- */
function askConfirm(title, text, okLabel){
  const d = $("dlg");
  if (!d.showModal) return Promise.resolve(confirm(title + "\n" + text));
  return new Promise(res => {
    $("dlgTitle").textContent = title; $("dlgText").textContent = text; $("dlgOk").textContent = okLabel;
    const done = v => { d.close(); res(v); };
    $("dlgOk").onclick = () => done(true); $("dlgNo").onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.onclick = e => { if (e.target !== d) return; const r = d.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) done(false); };
    d.showModal(); $("dlgNo").focus();
  });
}
function regCard(it){
  const li = document.createElement("li"), mineNow = mine.has(it.id);
  if (it.claimed) li.className = "claimed" + (mineNow ? " mine" : "");
  li.innerHTML = '<div><h3></h3><small></small><a target="_blank" rel="noopener"></a></div>';
  li.querySelector("h3").textContent = it.name;
  const sm = li.querySelector("small"), meta = [it.price, it.note].filter(Boolean).join(" · ");
  if (meta) sm.textContent = meta; else sm.remove();
  const a = li.querySelector("a");
  if (it.url){ a.href = it.url; a.textContent = "View item"; } else a.remove();
  if (it.claimed && !mineNow) return li;
  if (it.claimed){
    const t = document.createElement("span"); t.className = "tick"; t.textContent = "Ticked off. Thank you!";
    const u = linkBtn("Undo", async () => { if (await askConfirm("Put it back?", "“" + it.name + "” will show as available again.", "Yes, put it back")) claim(it.id, false, u); });
    li.append(t, u); return li;
  }
  const b = document.createElement("button");
  b.textContent = "I’ll get this"; b.onclick = async () => { if (await askConfirm("Tick off “" + it.name + "”?", "We’ll mark it as taken so nobody else doubles up. You can undo it later on this device.", "Yes, I’ll get this")) claim(it.id, true, b); };
  li.append(b); return li;
}
function regMsg(ul, text){ const li = document.createElement("li"); li.className = "regmsg"; li.textContent = text; ul.append(li); }
async function loadRegistry(){
  let items = [];
  try { items = await rpc("get_registry", {p_code:CODE}); } catch(e){}
  const ul = $("regList"), tk = $("regTaken"), wrap = $("regTakenWrap"), wasOpen = wrap.open;
  ul.innerHTML = ""; tk.innerHTML = "";
  if (!items.length){ regMsg(ul, "Our registry will appear here soon."); wrap.hidden = true; return; }
  const avail = items.filter(i => !i.claimed || mine.has(i.id)), taken = items.filter(i => i.claimed && !mine.has(i.id));
  if (!avail.length) regMsg(ul, "Everything has been ticked off. Thank you!");
  avail.forEach(i => ul.append(regCard(i)));
  taken.forEach(i => tk.append(regCard(i)));
  wrap.hidden = !taken.length; $("regTakenSum").textContent = "Already taken (" + taken.length + ")"; wrap.open = wasOpen && taken.length > 0;
}
async function claim(id, on, btn){
  btn.disabled = true;
  try {
    await rpc("claim_item", {p_code:CODE, p_id:id, p_claim:on});
    on ? mine.add(id) : mine.delete(id);
    sessionStorageSafe("set", JSON.stringify([...mine]));
  } catch(e){}
  loadRegistry();
}

/* ---- Start: reuse the last-seen look so the opening screen appears instantly ---- */
function readCache(){ try { return JSON.parse(localStorage.getItem("engLook") || "null"); } catch(e){ return null; } }
function writeCache(){ try { localStorage.setItem("engLook", JSON.stringify({title:S.title, event_date:S.event_date, place:S.place, hero_photo:S.hero_photo, colors:S.colors, open:S.open})); } catch(e){} }
function preload(src){
  return new Promise(res => {
    if (!src) return res();
    const i = new Image(); i.onload = i.onerror = () => res(); i.src = src;
    if (i.decode) i.decode().then(res, res);
  });
}
(async function boot(){
  try {
    const c = readCache(); if (c) Object.assign(S, c);
    applyGate();
    const net = fetchSettings(null);
    if (!c) await Promise.race([net, new Promise(r => setTimeout(r, 8000))]);
    applyGate();
    await preload(S.hero_photo);
    net.then(() => { writeCache(); applyGate(); });
  } finally { document.body.classList.remove("loading"); }
})();
</script>
