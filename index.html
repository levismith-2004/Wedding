<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--chalk:#F2F4F0;--ink:#1D2A24;--euc:#5B7264;--sea:#A8C1BA;--sand:#D9D0C1;--line:color-mix(in srgb,var(--ink) 18%,transparent)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--chalk);color:var(--ink);font:17px/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;line-height:1}
a{color:inherit}
:focus-visible{outline:2px solid var(--euc);outline-offset:3px}
[hidden]{display:none!important}

/* Gate */
.gate{min-height:100vh;min-height:100svh;display:grid;align-content:end;padding:clamp(24px,5vw,72px);color:#fff;
 background:linear-gradient(180deg,rgba(29,42,36,.15),rgba(29,42,36,.78)),var(--hero,linear-gradient(135deg,var(--euc),color-mix(in srgb,var(--euc) 45%,var(--chalk)) 55%,var(--sand))) center/cover}
.gate h1{font-size:clamp(64px,13vw,184px);letter-spacing:-.02em;animation:rise 1.2s ease both}
.gate h1 em{font-style:italic;opacity:.8}
.gate .when{font-size:clamp(18px,2.2vw,24px);margin:18px 0 36px}
.gate form{display:flex;gap:10px;flex-wrap:wrap;max-width:520px}
.gate label{flex-basis:100%;font-size:15px;opacity:.9}
input,select,textarea{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--ink);padding:10px 2px;width:100%;border-radius:0}
.gate input{color:#fff;border-color:#fff;flex:1 1 220px;width:auto;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.gate input::placeholder{color:rgba(255,255,255,.6);letter-spacing:0;text-transform:none}
button,.btn{font:inherit;font-weight:500;background:var(--ink);color:var(--chalk);border:0;padding:12px 26px;cursor:pointer;border-radius:999px;text-decoration:none;display:inline-block}
.gate button{background:#fff;color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.err{color:#ffd9d0;flex-basis:100%;min-height:1.4em;font-size:15px}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* Site */
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px clamp(20px,5vw,72px);background:color-mix(in srgb,var(--chalk) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav b{font:400 24px "Instrument Serif",serif}
nav div{display:flex;gap:22px;flex-wrap:wrap}
nav a{text-decoration:none;font-size:15px}
nav a:hover{text-decoration:underline}
section{padding:clamp(56px,9vw,120px) clamp(20px,5vw,72px);max-width:1180px;margin:auto}
h2{font-size:clamp(40px,6vw,76px);margin-bottom:36px}
.welcome{font-size:clamp(22px,3vw,34px);font-family:"Instrument Serif",serif;max-width:22ch}
.story{max-width:62ch;font-size:19px}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:40px 56px}
.details h3{font-size:30px;margin-bottom:8px}
.details p{white-space:pre-line}
.gallery{columns:3 260px;column-gap:14px}
.gallery figure{break-inside:avoid;margin:0 0 14px}
.gallery img,.ph{display:block;width:100%;border-radius:2px}
.ph{aspect-ratio:var(--r);background:var(--c)}
.band{background:var(--sand)}
.band>section{max-width:1180px}
form.rsvp{display:grid;gap:26px;max-width:560px}
.rsvp fieldset{border:0;padding:0;display:flex;gap:28px;flex-wrap:wrap}
.rsvp label{display:block;font-size:15px;margin-bottom:2px}
.rsvp .radio{display:flex;align-items:center;gap:10px;font-size:18px;margin:0;cursor:pointer}
.rsvp .radio input{width:auto}
.rsvp .names{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rsvp textarea{min-height:90px;resize:vertical}
.ok{color:var(--euc);font-weight:500}
.reg{list-style:none;padding:0;max-width:820px}
.reg li{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:center;padding:22px 0;border-top:1px solid var(--line)}
.reg li:last-child{border-bottom:1px solid var(--line)}
.reg h3{font-size:28px}
.reg small{display:block;opacity:.75;font-size:15px}
.reg .claimed h3{text-decoration:line-through;text-decoration-thickness:1px}
.reg .claimed{opacity:.6}
.reg button{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.reg .claimed button{border-color:transparent;text-decoration:underline;padding-inline:8px}
#adminTable{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
#adminTable th,#adminTable td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.adm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 18px;align-items:end;margin-bottom:28px}
.lnk,.reg button.lnk{background:none;color:var(--ink);border:0;border-radius:0;padding:4px 8px;text-decoration:underline}
.swatches{display:grid;gap:16px;margin-bottom:32px}
.sw{display:grid;grid-template-columns:150px 56px 120px;gap:14px;align-items:center;font-size:16px}
.sw input[type=color]{width:56px;height:40px;padding:0;border:1px solid var(--line);background:none;cursor:pointer}
.sw input[type=text]{width:120px;text-transform:uppercase}
.heropick{max-width:420px;margin-bottom:28px}
.heropick label{display:block;font-size:15px;margin-bottom:6px}
.heropick img{display:block;width:100%;margin:14px 0 6px;border-radius:2px}
footer{padding:48px;text-align:center;font-size:15px;opacity:.7}
@media (prefers-reduced-motion:reduce){.gate h1{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="gate" id="gate">
  <h1 id="gateNames"></h1>
  <p class="when" id="gateWhen"></p>
  <form id="codeForm">
    <label for="code">Enter the code from your invitation</label>
    <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Your code" required>
    <button type="submit" id="codeBtn">Open</button>
    <p class="err" id="codeErr" role="alert"></p>
  </form>
</header>

<main id="site" hidden>
  <nav>
    <b id="navNames"></b>
    <div><a href="#details">Details</a><a href="#gallery">Photos</a><a href="#rsvp">RSVP</a><a href="#registry">Registry</a></div>
  </nav>
  <section>
    <p class="welcome" id="welcome"></p>
  </section>
  <section id="story"><h2>Our story</h2><p class="story" id="storyText"></p></section>
  <section id="details"><h2>The day</h2><div class="details" id="detailsGrid"></div></section>
  <section id="gallery"><h2>Photos</h2><div class="gallery" id="galleryGrid"></div></section>
  <div class="band">
    <section id="rsvp">
      <h2>RSVP</h2>
      <form class="rsvp" id="rsvpForm">
        <div class="names">
          <div><label for="first">First name</label><input id="first" autocomplete="given-name" maxlength="80" required></div>
          <div><label for="last">Last name</label><input id="last" autocomplete="family-name" maxlength="80" required></div>
        </div>
        <fieldset>
          <label class="radio"><input type="radio" name="att" value="yes" required> Joyfully accepts</label>
          <label class="radio"><input type="radio" name="att" value="no"> Regretfully declines</label>
        </fieldset>
        <div><label for="diet">Dietary requirements</label><input id="diet" maxlength="500"></div>
        <div><label for="msg">A message for us</label><textarea id="msg" maxlength="1000"></textarea></div>
        <div><button type="submit" id="rsvpBtn">Send RSVP</button> <span class="ok" id="rsvpOk" role="status"></span></div>
      </form>
    </section>
  </div>
  <section id="registry">
    <h2>Registry</h2>
    <p class="story" style="margin-bottom:32px" id="regIntro"></p>
    <ul class="reg" id="regList"></ul>
  </section>
  <div class="band" id="adminWrap" hidden>
    <section id="admin">
      <h2>Guest list</h2>
      <p class="story" id="adminTotals" style="margin-bottom:24px"></p>
      <form class="adm" id="rForm">
        <input type="hidden" id="rId">
        <input id="rFirst" placeholder="First name" aria-label="First name" required>
        <input id="rLast" placeholder="Last name" aria-label="Last name" required>
        <select id="rAtt" aria-label="Reply"><option value="yes">Coming</option><option value="no">Declined</option></select>
        <input id="rDiet" placeholder="Dietary" aria-label="Dietary">
        <input id="rMsg" placeholder="Message" aria-label="Message">
        <div><button type="submit" id="rSave">Add reply</button> <button type="button" class="lnk" id="rCancel" hidden>Cancel</button></div>
      </form>
      <div style="overflow-x:auto"><table id="adminTable"></table></div>
      <h2 style="margin-top:80px">Edit registry</h2>
      <form class="adm" id="gForm">
        <input type="hidden" id="gId">
        <input id="gName" placeholder="Item name" aria-label="Item name" required>
        <input id="gUrl" type="url" placeholder="https://link-to-item" aria-label="Link">
        <input id="gPrice" placeholder="Price" aria-label="Price">
        <input id="gNote" placeholder="Note (size, colour)" aria-label="Note">
        <div><button type="submit" id="gSave">Add item</button> <button type="button" class="lnk" id="gCancel" hidden>Cancel</button></div>
      </form>
      <ul class="reg" id="adminReg"></ul>
      <h2 style="margin-top:80px">Appearance</h2>
      <div class="swatches" id="swatches"></div>
      <div class="heropick">
        <label for="heroFile">Photo on the landing page</label>
        <input type="file" id="heroFile" accept="image/*">
        <img id="heroPrev" alt="Landing page photo preview" hidden>
        <button type="button" class="lnk" id="heroRemove" hidden>Remove photo</button>
      </div>
      <p><button type="button" id="themeSave">Save appearance</button> <button type="button" class="lnk" id="themeReset">Reset colours</button> <span class="ok" id="themeMsg" role="status"></span></p>
    </section>
  </div>
  <footer id="footer"></footer>
</main>

<script>
/* ============ EDIT THIS BLOCK ============
   Only SUPABASE_URL and SUPABASE_ANON_KEY must be filled in here.
   Everything else below is a fallback: once you've run site-settings-setup.sql, the live
   names, date, story, details and photos come from the site_settings table in Supabase. */
const CONFIG = {
  SUPABASE_URL: "https://nuhxefrgldpxlbxshhfg.supabase.co",       // e.g. https://abcdxyz.supabase.co  (leave blank to preview with demo data; code: DEMO)
  SUPABASE_ANON_KEY: "sb_publishable_ME2xncbwLbOAplsJQcaGzg_D6_n_Aiw",  // the public "anon" key from Supabase > Settings > API
  names: ["Levi", "Shakira"],
  date: "Saturday 14 November 2027",
  place: "Gold Coast, Queensland",
  heroPhoto: "",          // e.g. "images/hero.jpg"
  story: "We met, we laughed, and we haven’t really stopped since. Write a few lines here about how it started and what the day means to you both.",
  registryIntro: "Your company is the gift. If you’d like to give something, tick it off below so nobody doubles up. We can’t see who ticked what.",
  details: [
    { title: "Ceremony", body: "3:30 pm\nVenue name\nStreet address" },
    { title: "Reception", body: "5:00 pm\nVenue name\nStreet address" },
    { title: "Dress", body: "Garden formal. Think linen, soft colours, comfortable shoes for the lawn." },
    { title: "Getting there", body: "Parking, shuttle times and nearby stays go here." }
  ],
  // Add your photos: put files in an "images" folder next to this file, then list them here.
  photos: [ /* { src: "images/one.jpg", alt: "The two of us at the beach" } */ ]
};
/* ========================================= */

const $ = id => document.getElementById(id);
const DEMO = !CONFIG.SUPABASE_URL;
let CODE = "", GUEST = null;
const mine = new Set(JSON.parse(sessionStorageSafe("get") || "[]"));
function sessionStorageSafe(op, v){ try { return op==="get" ? localStorage.getItem("claimed") : localStorage.setItem("claimed", v); } catch(e){ return null; } }

/* ---- API: all access goes through Supabase RPC functions (see setup.sql) ---- */
const demoDB = { rsvps: [
  {id:1,first_name:"Jess",last_name:"Carter",attending:true,dietary:"Vegetarian",message:"Can’t wait!"},
  {id:2,first_name:"Priya",last_name:"Shah",attending:false,dietary:"",message:"Sorry, we’ll be overseas."}], items: [
  {id:1,name:"Linen sheet set",url:"https://example.com",price:"$220",note:"Sage, queen",claimed:false},
  {id:2,name:"Cast iron casserole",url:"https://example.com",price:"$180",note:"",claimed:true},
  {id:3,name:"Honeymoon fund",url:"https://example.com",price:"Any amount",note:"",claimed:false}]};
async function rpc(fn, args){
  if (DEMO){
    if (fn==="get_settings") return null;
    if (fn==="admin_save_settings") return true;
    if (fn==="check_code"){
      const c = args.p_code.trim().toUpperCase();
      if (c==="DEMO") return {is_admin:false};
      if (c==="ADMIN") return {is_admin:true};
      return null;
    }
    if (fn==="admin_rsvps") return demoDB.rsvps;
    if (fn==="admin_save_rsvp"){
      const row = {id:args.p_id||Date.now(), first_name:args.p_first, last_name:args.p_last, attending:args.p_attending, dietary:args.p_dietary, message:args.p_message};
      const i = demoDB.rsvps.findIndex(r=>r.id===args.p_id);
      if (i>=0) demoDB.rsvps[i]=row; else demoDB.rsvps.push(row);
      return true;
    }
    if (fn==="admin_delete_rsvp"){ demoDB.rsvps = demoDB.rsvps.filter(r=>r.id!==args.p_id); return true; }
    if (fn==="admin_save_item"){
      if (args.p_id) Object.assign(demoDB.items.find(i=>i.id===args.p_id), {name:args.p_name,url:args.p_url,price:args.p_price,note:args.p_note});
      else demoDB.items.push({id:Date.now(),name:args.p_name,url:args.p_url,price:args.p_price,note:args.p_note,claimed:false});
      return true;
    }
    if (fn==="admin_delete_item"){ demoDB.items = demoDB.items.filter(i=>i.id!==args.p_id); return true; }
    if (fn==="submit_rsvp") return true;
    if (fn==="get_registry") return demoDB.items;
    if (fn==="claim_item"){ demoDB.items.find(i=>i.id===args.p_id).claimed=args.p_claim; return true; }
  }
  const r = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method:"POST",
    headers:Object.assign({"Content-Type":"application/json", apikey:CONFIG.SUPABASE_ANON_KEY}, CONFIG.SUPABASE_ANON_KEY.startsWith("eyJ") ? {Authorization:"Bearer "+CONFIG.SUPABASE_ANON_KEY} : {}),
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error("Request failed");
  return r.json();
}

/* ---- Content: loaded from Supabase site_settings, with CONFIG as the fallback ---- */
const S = { name_one:CONFIG.names[0], name_two:CONFIG.names[1], wedding_date:CONFIG.date, place:CONFIG.place,
  hero_photo:CONFIG.heroPhoto, story:CONFIG.story, registry_intro:CONFIG.registryIntro, details:CONFIG.details, photos:CONFIG.photos, colors:{} };
async function fetchSettings(code){
  try {
    const r = await rpc("get_settings", {p_code:code});
    if (r) Object.keys(r).forEach(k => { if (r[k] !== null && r[k] !== "") S[k] = r[k]; });
  } catch(e){}
}
const THEME = [["bg","Background","--chalk","#F2F4F0"],["text","Text","--ink","#1D2A24"],["accent","Accent","--euc","#5B7264"],["band","Section band","--sand","#D9D0C1"]];
const HEX = /^#[0-9a-fA-F]{6}$/;
function applyTheme(c){
  c = c || {};
  THEME.forEach(([k,,v]) => { if (HEX.test(c[k]||"")) document.documentElement.style.setProperty(v, c[k]); else document.documentElement.style.removeProperty(v); });
}
function applyGate(){
  applyTheme(S.colors);
  document.title = S.name_one + " & " + S.name_two + " | Wedding";
  const h = $("gateNames"); h.textContent = S.name_one + " ";
  const em = document.createElement("em"); em.textContent = "&"; h.append(em, " " + S.name_two);
  $("gateWhen").textContent = S.wedding_date + ", " + S.place;
  if (S.hero_photo) document.documentElement.style.setProperty("--hero", 'url("' + encodeURI(S.hero_photo) + '")');
  else document.documentElement.style.removeProperty("--hero");
}
const tones = ["#A8C1BA","#D9D0C1","#5B7264","#C5D3CC","#B9AE9B","#8FA89B"], ratios = ["4/5","1/1","3/4","4/3","4/5","1/1"];
function applySite(){
  const names = S.name_one + " & " + S.name_two;
  $("navNames").textContent = names;
  $("storyText").textContent = S.story || "";
  $("regIntro").textContent = S.registry_intro || "";
  $("footer").textContent = names + " · " + S.wedding_date;
  $("detailsGrid").innerHTML = "";
  (S.details || []).forEach(d => {
    const el = document.createElement("div");
    el.innerHTML = "<h3></h3><p></p>";
    el.firstChild.textContent = d.title || ""; el.lastChild.textContent = d.body || "";
    $("detailsGrid").append(el);
  });
  $("galleryGrid").innerHTML = "";
  const gal = (S.photos && S.photos.length) ? S.photos : tones.map((c,i)=>({ph:true,c,r:ratios[i]}));
  gal.forEach(p => {
    const f = document.createElement("figure");
    if (p.ph){ f.innerHTML = '<div class="ph" role="img" aria-label="Photo placeholder"></div>'; f.firstChild.style.cssText = "--c:"+p.c+";--r:"+p.r; }
    else { const i = new Image(); i.src = p.src; i.alt = p.alt || ""; i.loading = "lazy"; f.append(i); }
    $("galleryGrid").append(f);
  });
}
applyGate();
fetchSettings(null).then(applyGate);

/* ---- Gate ---- */
$("codeForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("codeErr").textContent = ""; $("codeBtn").disabled = true;
  try {
    const code = $("code").value.trim().toUpperCase();
    const g = await rpc("check_code", {p_code: code});
    if (!g){ $("codeErr").textContent = "That code didn’t work. Check your invitation and try again."; return; }
    CODE = code; GUEST = g; await unlock();
  } catch(err){ $("codeErr").textContent = "Something went wrong. Please try again in a moment."; }
  finally { $("codeBtn").disabled = false; }
});

async function unlock(){
  await fetchSettings(CODE); applyGate(); applySite();
  $("gate").hidden = true; $("site").hidden = false; scrollTo(0,0);
  $("welcome").textContent = "Welcome, and thank you for being part of our day.";
  loadRegistry();
  if (GUEST.is_admin) loadAdmin();
}
const linkBtn = (label, fn) => { const b = document.createElement("button"); b.type="button"; b.className="lnk"; b.textContent=label; b.onclick=fn; return b; };
async function loadAdmin(){
  $("adminWrap").hidden = false;
  let rows = [];
  try { rows = await rpc("admin_rsvps", {p_code:CODE}); } catch(e){}
  const yes = rows.filter(r=>r.attending===true).length, no = rows.filter(r=>r.attending===false).length;
  $("adminTotals").textContent = yes + " coming, " + no + " declined. " + rows.length + " replies so far.";
  const t = $("adminTable"); t.innerHTML = "<tr><th>Name</th><th>Reply</th><th>Dietary</th><th>Message</th><th></th></tr>";
  rows.forEach(r => {
    const tr = t.insertRow();
    [r.first_name + " " + r.last_name, r.attending ? "Yes" : "No", r.dietary||"", r.message||""].forEach(v => { tr.insertCell().textContent = v; });
    const td = tr.insertCell(); td.style.whiteSpace = "nowrap";
    td.append(linkBtn("Edit", () => editReply(r)), linkBtn("Delete", () => delReply(r)));
  });
  loadAdminReg(); buildAppearance();
}
function editReply(r){
  $("rId").value = r.id; $("rFirst").value = r.first_name; $("rLast").value = r.last_name;
  $("rAtt").value = r.attending ? "yes" : "no"; $("rDiet").value = r.dietary||""; $("rMsg").value = r.message||"";
  $("rSave").textContent = "Save changes"; $("rCancel").hidden = false; $("rForm").scrollIntoView({block:"center"});
}
function resetReply(){ $("rForm").reset(); $("rId").value = ""; $("rSave").textContent = "Add reply"; $("rCancel").hidden = true; }
$("rCancel").onclick = resetReply;
$("rForm").addEventListener("submit", async e => {
  e.preventDefault(); $("rSave").disabled = true;
  try {
    const ok = await rpc("admin_save_rsvp", {p_code:CODE, p_id:$("rId").value ? +$("rId").value : null, p_first:$("rFirst").value.trim(), p_last:$("rLast").value.trim(), p_attending:$("rAtt").value==="yes", p_dietary:$("rDiet").value, p_message:$("rMsg").value});
    if (!ok) throw new Error();
    resetReply(); await loadAdmin();
  } catch(err){ alert("Couldn’t save. Check the name isn’t already on the list."); }
  finally { $("rSave").disabled = false; }
});
async function delReply(r){
  if (!confirm("Delete the reply from " + r.first_name + " " + r.last_name + "?")) return;
  try { await rpc("admin_delete_rsvp", {p_code:CODE, p_id:r.id}); } catch(e){ alert("Couldn’t delete."); }
  loadAdmin();
}

async function loadAdminReg(){
  let items = [];
  try { items = await rpc("get_registry", {p_code:CODE}); } catch(e){}
  const ul = $("adminReg"); ul.innerHTML = "";
  if (!items.length){ ul.innerHTML = "<li>No items yet. Add your first one above.</li>"; return; }
  items.forEach(it => {
    const li = document.createElement("li");
    li.innerHTML = "<div><h3></h3><small></small></div><div></div>";
    li.querySelector("h3").textContent = it.name;
    li.querySelector("small").textContent = [it.price, it.note, it.url].filter(Boolean).join(" · ");
    li.lastChild.append(linkBtn("Edit", () => editItem(it)), linkBtn("Delete", () => delItem(it)));
    ul.append(li);
  });
}
function editItem(it){
  $("gId").value = it.id; $("gName").value = it.name; $("gUrl").value = it.url||""; $("gPrice").value = it.price||""; $("gNote").value = it.note||"";
  $("gSave").textContent = "Save changes"; $("gCancel").hidden = false; $("gForm").scrollIntoView({block:"center"});
}
function resetItem(){ $("gForm").reset(); $("gId").value = ""; $("gSave").textContent = "Add item"; $("gCancel").hidden = true; }
$("gCancel").onclick = resetItem;
$("gForm").addEventListener("submit", async e => {
  e.preventDefault(); $("gSave").disabled = true;
  try {
    const ok = await rpc("admin_save_item", {p_code:CODE, p_id:$("gId").value ? +$("gId").value : null, p_name:$("gName").value.trim(), p_url:$("gUrl").value.trim(), p_price:$("gPrice").value, p_note:$("gNote").value});
    if (!ok) throw new Error();
    resetItem(); await loadAdminReg(); loadRegistry();
  } catch(err){ alert("Couldn’t save the item."); }
  finally { $("gSave").disabled = false; }
});
async function delItem(it){
  if (!confirm("Delete “" + it.name + "” from the registry?")) return;
  try { await rpc("admin_delete_item", {p_code:CODE, p_id:it.id}); } catch(e){ alert("Couldn’t delete."); }
  loadAdminReg(); loadRegistry();
}

/* ---- Appearance (admin) ---- */
let appearanceBuilt = false, heroPending;
function buildAppearance(){
  if (appearanceBuilt) return; appearanceBuilt = true;
  THEME.forEach(([k,label,,def]) => {
    const cur = HEX.test((S.colors||{})[k]||"") ? S.colors[k] : def;
    const row = document.createElement("div"); row.className = "sw";
    row.innerHTML = '<span></span><input type="color"><input type="text" maxlength="7" spellcheck="false">';
    const [lab, pick, hex] = row.children;
    lab.textContent = label; pick.setAttribute("aria-label", label + " colour"); hex.setAttribute("aria-label", label + " hex code");
    pick.value = cur; hex.value = cur.toUpperCase();
    pick.oninput = () => { hex.value = pick.value.toUpperCase(); setColor(k, pick.value); };
    hex.oninput = () => { let v = hex.value.trim(); if (v && v[0] !== "#") v = "#" + v; if (HEX.test(v)){ pick.value = v; setColor(k, v); } };
    $("swatches").append(row);
  });
  showHero(S.hero_photo);
}
function setColor(k, v){ S.colors = {...(S.colors||{}), [k]: v}; applyTheme(S.colors); }
$("themeReset").onclick = () => {
  S.colors = {}; applyTheme({});
  document.querySelectorAll("#swatches .sw").forEach((row, i) => { row.children[1].value = THEME[i][3]; row.children[2].value = THEME[i][3]; });
};
function showHero(src){ $("heroPrev").hidden = !src; if (src) $("heroPrev").src = src; $("heroRemove").hidden = !src; }
function resizeImage(file, max){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.82, out = c.toDataURL("image/jpeg", q);
      while (out.length > 1200000 && q > 0.4){ q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      out.length > 1400000 ? rej(new Error("too big")) : res(out);
    };
    img.onerror = () => rej(new Error("bad image")); img.src = url;
  });
}
$("heroFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = await resizeImage(f, 1800); heroPending = d; S.hero_photo = d; showHero(d); applyGate(); }
  catch(err){ alert("Couldn’t use that image. Try a JPG or PNG."); }
};
$("heroRemove").onclick = () => { heroPending = ""; S.hero_photo = ""; showHero(""); applyGate(); $("heroFile").value = ""; };
$("themeSave").onclick = async () => {
  const b = $("themeSave"); b.disabled = true; $("themeMsg").textContent = "";
  try {
    const ok = await rpc("admin_save_settings", {p_code:CODE, p_colors:S.colors||{}, p_hero_photo: heroPending === undefined ? null : heroPending});
    if (!ok) throw new Error();
    heroPending = undefined; $("themeMsg").textContent = "Saved. Guests will see this from their next visit.";
  } catch(err){ $("themeMsg").textContent = "Couldn’t save. If you changed the photo, try a smaller one."; }
  finally { b.disabled = false; }
};

/* ---- RSVP ---- */
$("rsvpForm").addEventListener("submit", async e => {
  e.preventDefault(); $("rsvpBtn").disabled = true; $("rsvpOk").textContent = "";
  try {
    const yes = document.querySelector("input[name=att]:checked").value === "yes";
    const first = $("first").value.trim();
    const ok = await rpc("submit_rsvp", {p_code:CODE, p_first:first, p_last:$("last").value.trim(), p_attending:yes, p_dietary:$("diet").value, p_message:$("msg").value});
    if (!ok) throw new Error("rejected");
    $("rsvpOk").textContent = (yes ? "Thanks, " + first + ". We can’t wait to celebrate with you." : "Thanks for letting us know, " + first + ". We’ll miss you.") + " To reply for someone else, type their name above and send again.";
  } catch(err){ $("rsvpOk").textContent = "That didn’t send. Please try again."; }
  finally { $("rsvpBtn").disabled = false; }
});

/* ---- Registry ---- */
async function loadRegistry(){
  let items = [];
  try { items = await rpc("get_registry", {p_code:CODE}); } catch(e){}
  const ul = $("regList"); ul.innerHTML = "";
  if (!items.length){ ul.innerHTML = "<li>Our registry will appear here soon.</li>"; return; }
  items.forEach(it => {
    const li = document.createElement("li");
    const mineNow = mine.has(it.id);
    if (it.claimed) li.className = "claimed";
    li.innerHTML = '<div><h3></h3><small></small><a target="_blank" rel="noopener"></a></div>';
    li.querySelector("h3").textContent = it.name;
    li.querySelector("small").textContent = [it.price, it.note].filter(Boolean).join(" · ");
    const a = li.querySelector("a");
    if (it.url){ a.href = it.url; a.textContent = "View item"; } else a.remove();
    const b = document.createElement("button");
    if (!it.claimed){ b.textContent = "I’ll get this"; b.onclick = () => claim(it.id, true, b); }
    else if (mineNow){ b.textContent = "You ticked this. Undo"; b.onclick = () => claim(it.id, false, b); }
    else { b.textContent = "Already taken"; b.disabled = true; }
    li.append(b); ul.append(li);
  });
}
async function claim(id, on, btn){
  btn.disabled = true;
  try {
    await rpc("claim_item", {p_code:CODE, p_id:id, p_claim:on});
    on ? mine.add(id) : mine.delete(id);
    sessionStorageSafe("set", JSON.stringify([...mine]));
  } catch(e){}
  loadRegistry();
}
</script>
